# Local:      docker compose --profile local up --build      → http://localhost:8080
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
name: knowledge-assistant

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      TRUST_PROXY: "1"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/knowledge_assistant?replicaSet=rs0}
      # Empty = keyword-only search. To enable semantic search: start with `--profile vector`,
      # set VECTOR_DB_URL=http://qdrant:6333 and an embeddings key (EMBEDDING_API_KEY).
      VECTOR_DB_URL: ${VECTOR_DB_URL:-}
      # Overridable from the shell (scripts/demo.sh adds the public tunnel URL); otherwise from .env.
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:8080,http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    depends_on:
      # Local MongoDB is the default. When MONGODB_URI points at Atlas, the mongo container
      # still starts but is unused; production disables it in docker-compose.prod.yml.
      mongo: { condition: service_healthy, required: false }
    restart: unless-stopped
    expose: ["4000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
    environment:
      # Server-only: used by Clerk's Next.js middleware. Never exposed to the browser.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      # Also provided at runtime so server-side Clerk code never sees a stale build value.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
    restart: unless-stopped
    expose: ["3000"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes:
      - ./deploy/nginx/http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/common.conf:/etc/nginx/snippets/common.conf:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    logging: *logging

  # Optional vector DB (`--profile vector`): one embedding per section for semantic search.
  qdrant:
    image: qdrant/qdrant:v1.20.0
    profiles: [vector]
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      # Optional: require an API key (set the same value as VECTOR_DB_API_KEY for the API).
      QDRANT__SERVICE__API_KEY: ${VECTOR_DB_API_KEY:-}
    expose: ["6333"]
    # Localhost-only, for the dashboard at http://localhost:6333/dashboard. Never public.
    ports: ["127.0.0.1:${QDRANT_PORT:-6333}:6333"]
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Optional public URL for demos (`--profile public`): a Cloudflare quick tunnel to Nginx.
  # No account needed; the https://<random>.trycloudflare.com URL is printed in this service's logs.
  # scripts/demo.sh starts it and wires the URL into Clerk's allowed origins.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [public]
    command: ["tunnel", "--no-autoupdate", "--url", "http://nginx:80"]
    restart: unless-stopped
    depends_on:
      nginx: { condition: service_started }
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Default local database (a single-node replica set: transactions need one).
  # Production uses MongoDB Atlas instead (see docker-compose.prod.yml).
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    logging: *logging

volumes:
  mongo-data:
  qdrant-data:
