# Shared proxy rules (included inside a server block).
server_tokens off;
client_max_body_size 6m;          # API enforces the exact upload limit
client_body_timeout 15s;
keepalive_timeout 30s;

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;

proxy_http_version 1.1;
# Note: any proxy_set_header inside a location drops ALL of these, so keep them here only.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;   # "" for normal requests (keepalive), "upgrade" for websockets
# $http_host keeps the client-facing port (e.g. localhost:8080) so app/Clerk redirects stay on it.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
proxy_set_header X-Forwarded-Proto $forwarded_proto;

location /api/ {
    limit_req zone=api burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://api_upstream;
    proxy_read_timeout 75s;                       # > AI_TIMEOUT_MS
    proxy_buffering off;
}

location /_next/static/ {
    proxy_pass http://web_upstream;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
    proxy_pass http://web_upstream;
}
