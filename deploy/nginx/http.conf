limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
# Behind a TLS-terminating tunnel (cloudflared) keep the original https scheme so app/Clerk
# redirects stay on https; direct local hits fall back to this server's scheme.
map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }
upstream api_upstream { server api:4000; keepalive 16; }
upstream web_upstream { server web:3000; keepalive 16; }

server {
    listen 80;
    include /etc/nginx/snippets/common.conf;
}
